name: Deploy VELQON to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test backend and launch engine
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_VELQON_API_ORIGIN: ${{ vars.VELQON_API_ORIGIN }}
      - name: Verify community flows with a test wallet
        run: npm run test:browser
      - name: Check production Docker image
        run: |
          docker build -t velqon-ci .
          docker run --rm -d --name velqon-ci -p 127.0.0.1:4188:4188 velqon-ci
          trap 'docker rm -f velqon-ci >/dev/null 2>&1 || true' EXIT
          if ! curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:4188/api/v1/health; then
            docker logs velqon-ci
            exit 1
          fi
      - name: Save browser verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: velqon-browser-qa
          path: velqon-complete-*.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages publishing to finish
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 36; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 30
              })
              const legacy = data.workflow_runs.filter(run =>
                run.head_sha === context.sha && run.event === 'dynamic' &&
                run.name === 'pages build and deployment' && run.status !== 'completed'
              )
              if (!legacy.length) {
                core.info('No competing legacy publisher is running.')
                return
              }
              core.info('Waiting for the legacy publisher before deploying built assets.')
              await new Promise(resolve => setTimeout(resolve, 5000))
            }
            core.setFailed('A legacy Pages publisher is still running. Use GitHub Actions as the Pages source.')
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published frontend in Chrome
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --prefix "$RUNNER_TEMP/wallemo-check" playwright
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          const require = createRequire(process.env.RUNNER_TEMP + '/wallemo-check/package.json')
          const { chromium } = require('playwright')
          const browser = await chromium.launch({ channel: 'chrome', headless: true, args: ['--no-sandbox'] })
          try {
            const page = await browser.newPage()
            page.on('pageerror', error => console.log('PAGE ERROR:', error.message))
            page.on('console', message => { if(message.type()==='error') console.log('CONSOLE ERROR:', message.text()) })
            page.on('response', response => { if(response.status()>=400) console.log('HTTP ERROR:', response.status(), response.url()) })
            const url = new URL(process.env.SITE_URL)
            const response = await page.goto(url.href, { waitUntil: 'networkidle', timeout: 60000 })
            console.log('HTTP:', response.status(), 'URL:', page.url())
            console.log('SCRIPTS:', await page.locator('script[src]').evaluateAll(nodes => nodes.map(node => node.src)))
            console.log('BODY:', (await page.locator('body').innerText()).slice(0,1500))
            await page.locator('.terminal-os').waitFor({timeout:15000})
            await page.getByRole('heading', {level:1, name: 'Give your agent a public beginning.'}).waitFor()
            console.log('BRAND:', await page.locator('body').evaluate(node => ({background:getComputedStyle(node).backgroundColor,color:getComputedStyle(node).color})))
            await page.getByRole('button', {name: 'CONNECT WALLET', exact: true}).click()
            await page.locator('.primary-wallets').waitFor()
            await page.getByRole('button', {name: 'Phantom not detected', exact: true}).waitFor()
            await page.getByRole('button', {name: 'Backpack not detected', exact: true}).waitFor()
            console.log('PASS: live Phantom and Backpack connection entries are present')
            console.log('PASS: published VELQON frontend rendered')
          } finally { await browser.close() }
          NODE
