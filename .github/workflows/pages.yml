name: Deploy WALLEMO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published frontend in Chrome
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --prefix "$RUNNER_TEMP/wallemo-check" playwright
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          const require = createRequire(process.env.RUNNER_TEMP + '/wallemo-check/package.json')
          const { chromium } = require('playwright')
          const browser = await chromium.launch({ channel: 'chrome', headless: true, args: ['--no-sandbox'] })
          try {
            const page = await browser.newPage()
            page.on('pageerror', error => console.log('PAGE ERROR:', error.message))
            page.on('console', message => { if(message.type()==='error') console.log('CONSOLE ERROR:', message.text()) })
            page.on('response', response => { if(response.status()>=400) console.log('HTTP ERROR:', response.status(), response.url()) })
            const url = new URL(process.env.SITE_URL)
            const response = await page.goto(url.href, { waitUntil: 'networkidle', timeout: 60000 })
            console.log('HTTP:', response.status(), 'URL:', page.url())
            console.log('SCRIPTS:', await page.locator('script[src]').evaluateAll(nodes => nodes.map(node => node.src)))
            console.log('BODY:', (await page.locator('body').innerText()).slice(0,1500))
            await page.locator('.terminal-os').waitFor({timeout:15000})
            console.log('PASS: published WALLEMO frontend rendered')
          } finally { await browser.close() }
          NODE
