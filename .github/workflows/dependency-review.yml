name: Inspect production dependency advisories
on:
  push:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Report known upstream SDK advisories
        continue-on-error: true
        run: npm audit --omit=dev
